name: Publicar imágenes Docker

on:
  push:
    branches:
      - main

concurrency:
  group: publish-and-release-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/web-games

jobs:
  version:
    name: Calcular versión
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Descargar historial y etiquetas
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular la siguiente versión SemVer
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -z "$latest_tag" ]; then
            echo "tag=v1.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$version"

          if printf '%s' "$COMMIT_MESSAGE" | grep -Eq 'BREAKING CHANGE|^[[:alpha:]]+(\([^)]+\))?!:'; then
            major=$((major + 1)); minor=0; patch=0
          elif printf '%s' "$COMMIT_MESSAGE" | grep -Eq '^feat(\([^)]+\))?:'; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi

          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

  publish:
    name: Construir y publicar
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar la imagen de la aplicación
        uses: docker/build-push-action@v6
        with:
          context: ./code
          target: app
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:${{ needs.version.outputs.tag }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  release:
    name: Crear release
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Crear release para el commit publicado
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "La release $TAG ya existe."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Release $TAG" \
            --generate-notes
